name: EAS Android APK Build & Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to run'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - update

jobs:
  eas:
    name: EAS Build / Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🛠 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📱 Build Android Preview APK
        if: github.event.inputs.action == 'build' || github.event.inputs.action == '' || github.event_name == 'push'
        run: eas build --profile preview --platform android --non-interactive

      - name: 🚀 Publish Over-The-Air (OTA) Update
        if: github.event.inputs.action == 'update'
        run: eas update --auto
