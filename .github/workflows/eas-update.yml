name: EAS Mobile Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to run'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - build

jobs:
  eas:
    name: EAS Publish / Build
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🛠 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install Dependencies
        run: npm install

      # -------------------------------------------------------------
      # Mode A: Full Android APK Build
      # Triggers if:
      # 1. Commit message contains '[build]' or '[apk]' or 'build-apk'
      # 2. Or manually chosen as 'build' in GitHub Actions workflow_dispatch
      # -------------------------------------------------------------
      - name: 📱 Build Android Preview APK
        if: |
          github.event.inputs.action == 'build' ||
          contains(github.event.head_commit.message, '[build]') ||
          contains(github.event.head_commit.message, '[apk]') ||
          contains(github.event.head_commit.message, 'build-apk')
        run: eas build --profile preview --platform android --non-interactive

      # -------------------------------------------------------------
      # Mode B: Fast Over-The-Air (OTA) Update (Default for all normal commits)
      # Triggers if NOT a full build request
      # -------------------------------------------------------------
      - name: 🚀 Publish Over-The-Air (OTA) Update
        if: |
          github.event.inputs.action == 'update' ||
          (!contains(github.event.head_commit.message, '[build]') &&
           !contains(github.event.head_commit.message, '[apk]') &&
           !contains(github.event.head_commit.message, 'build-apk') &&
           github.event.inputs.action == '')
        run: eas update --auto
